name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check metadata and documentation
        run: python3 tools/check.py
      - name: Compile Lua sources
        run: find src tests examples -name '*.lua' -exec luac5.1 -p {} +
      - name: Run focused contracts
        run: lua5.1 tests/run.lua
